<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="login" class="login"><div class="card"><h1>🛡️ Admin Panel</h1><p>Great India Technology</p><form id="lf"><input id="em" type="email" placeholder="Admin Email" required><input id="pw" type="password" placeholder="Password" required><button>Login</button></form><div id="lm"></div></div></div>
<div id="app" class="hide"><header><b>🛡️ Admin Panel</b><span id="who"></span><button id="lo">Logout</button></header><div class="layout"><aside><button class="nav active" data-p="dash">📊 Dashboard</button><button class="nav" data-p="owners">👥 Owners</button><button class="nav" data-p="pages">🏫 Coaching Pages</button></aside><main>
<section id="dash" class="page active"><h1>Dashboard</h1><div class="stats"><div><b id="no">0</b><small>Owners</small></div><div><b id="nc">0</b><small>Coaching Pages</small></div><div><b id="nb">0</b><small>Batches</small></div></div><div class="box"><h2>Recent Pages</h2><div id="recent"></div></div></section>
<section id="owners" class="page"><h1>Owners</h1><input class="search" id="os" placeholder="Search owner, email, coaching"><div id="ot"></div></section>
<section id="pages" class="page"><h1>Coaching Pages</h1><input class="search" id="ps" placeholder="Search coaching, slug, phone"><div id="pt"></div></section>
</main></div></div>
<div id="modal" class="modal hide"><div class="modalbox"><button id="x">×</button><h2>Edit Coaching</h2><form id="ef"><input id="eid" type="hidden"><label>Name<input id="en" required></label><label>Slug<input id="es" required></label><label>About<textarea id="ed"></textarea></label><div class="grid"><label>Founder<input id="efn"></label><label>Designation<input id="eds"></label></div><div class="grid"><label>Phone<input id="ep"></label><label>Email<input id="ee" type="email"></label></div><label>Address<textarea id="ea"></textarea></label><button>Save Changes</button><div id="msg"></div></form></div></div>
<script src="config.js"></script><script src="admin.js"></script></body></html>
